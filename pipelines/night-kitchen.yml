# night-kitchen.yml — THE NIGHT KITCHEN: a multistep agentic relay scenario.
#
# Scenario: every cycle is a "kitchen night". Five agent personas hand work
# to each other through S3 artifacts (epoch-key detection, the proven
# docs-agent pattern), and the Knowledge Base is their shared memory — every
# stage's thinking is mirrored there and stays searchable:
#
#   scout     -> fetch one AI paper (agents/fetch_papers.py); the card lands
#               in doc-inbox (docs-agent summarizes it) AND in the kitchen
#               queue ci-artifacts/nk/papers/.
#   distiller -> extract the paper's core MECHANISM as a design card JSON
#               (nk/design/) — reader persona, strata.
#   taster    -> critic persona scores each card for feasibility HERE
#               (offline, <=200 lines, stdlib only); winner -> nk/winner/,
#               every verdict note -> KB (discard reasoning stays searchable).
#   cook      -> builder persona writes a real prototype (Go or Python) and
#               pushes it to the night-kitchen repo's single review channel
#               `review/next` (force-push per cycle), gate-checked first;
#               build manifest -> nk/built/ + KB.
#   serve     -> the repo-review agent (agents/review_change.py) reviews the
#               pushed code (gates + prowl + strata), opens the PR, and
#               mirrors the review notes + sources into the KB.
#   wash-up   -> janitor persona assembles the whole night into one kitchen
#               log (nk/log/) and feeds it back into doc-inbox, so the log
#               gets summarized by docs-agent too — a fully closed loop.
#
# Triggers: `twice-daily` time resource fires the scout; every other job is
# event-driven from the previous stage's S3 output; all jobs are also
# manually triggerable (fly trigger-job / web UI) to run one stage at a time.
#
# Apply:
#   fly -t local set-pipeline -p night-kitchen -c pipelines/night-kitchen.yml \
#       -l ~/.config/containers/config/concourse/pipeline-vars.yml

resources:
- name: twice-daily
  type: time
  source:
    interval: 12h

- name: nk-queue
  type: s3
  check_every: 1m
  source:
    bucket: ci-artifacts
    endpoint: http://systemd-s3:3900
    disable_ssl: true
    use_path_style: true
    region_name: garage
    access_key_id: ((s3-ak))
    secret_access_key: ((s3-sk))
    skip_download: true
    regexp: "^nk/papers/(?P<version>[0-9]{9,11})-.*\\.md$"

- name: nk-cards
  type: s3
  check_every: 1m
  source:
    bucket: ci-artifacts
    endpoint: http://systemd-s3:3900
    disable_ssl: true
    use_path_style: true
    region_name: garage
    access_key_id: ((s3-ak))
    secret_access_key: ((s3-sk))
    skip_download: true
    regexp: "^nk/design/(?P<version>[0-9]{9,11})-.*\\.json$"

- name: nk-winner
  type: s3
  check_every: 1m
  source:
    bucket: ci-artifacts
    endpoint: http://systemd-s3:3900
    disable_ssl: true
    use_path_style: true
    region_name: garage
    access_key_id: ((s3-ak))
    secret_access_key: ((s3-sk))
    skip_download: true
    regexp: "^nk/winner/(?P<version>[0-9]{9,11})-.*\\.json$"

- name: change   # names mandatory: agents/review_change.py expects the
  type: git    # review checkout at ./change (repo-review convention)
  check_every: 30s
  source:
    uri: http://systemd-forge:3000/pipeline/night-kitchen.git
    branch: review/next
    username: ((forge-user))
    password: ((forge-token))

- name: base
  type: git
  check_every: 5m
  source:
    uri: http://systemd-forge:3000/pipeline/night-kitchen.git
    branch: main
    username: ((forge-user))
    password: ((forge-token))

- name: tooling
  type: git
  check_every: 1m
  source:
    uri: http://systemd-forge:3000/pipeline/pipeline-lab.git
    branch: main
    username: ((forge-user))
    password: ((forge-token))

jobs:
- name: scout
  build_log_retention: {builds: 20}
  plan:
  - get: twice-daily
    trigger: true
  - get: tooling
  - task: scout-one-paper
    timeout: 15m
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: docker.io/library/python, tag: 3.14-slim}
      inputs: [{name: tooling}]
      outputs: [{name: scout-out}]
      params:
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        INBOX_BUCKET: doc-inbox
        ARTIFACTS_BUCKET: ci-artifacts
        NK_QUEUE_BUCKET: ci-artifacts
        PAPER_LIMIT: "1"
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          pip install --quiet boto3
          python tooling/agents/fetch_papers.py 2>&1 | tee scout-out/run.log

- name: distiller
  build_log_retention: {builds: 20}
  plan:
  - get: nk-queue
    trigger: true
  - get: tooling
  - task: extract-mechanism
    timeout: 15m
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: docker.io/library/python, tag: 3.14-slim}
      inputs: [{name: nk-queue}, {name: tooling}]
      outputs: [{name: distill-out}]
      params:
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        ARTIFACTS_BUCKET: ci-artifacts
        STRATA_URL: http://systemd-strata:8080/v1
        STRATA_API_KEY: ((strata-key))
        STRATA_MODEL: auto
        RAGFLOW_URL: http://systemd-ragflow:9380
        RAGFLOW_API_KEY: ((kb-ragflow-key))
        LIGHTRAG_URL: http://systemd-lightrag:9621
        LIGHTRAG_API_KEY: ((kb-lightrag-key))
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          pip install --quiet boto3
          cp tooling/agents/nk_common.py tooling/agents/nk_distill.py tooling/agents/kb_ingest.py .
          python nk_distill.py 2>&1 | tee distill-out/run.log

- name: taster
  build_log_retention: {builds: 20}
  plan:
  - get: nk-cards
    trigger: true
  - get: tooling
  - task: judge-cards
    timeout: 15m
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: docker.io/library/python, tag: 3.14-slim}
      inputs: [{name: nk-cards}, {name: tooling}]
      outputs: [{name: taste-out}]
      params:
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        ARTIFACTS_BUCKET: ci-artifacts
        STRATA_URL: http://systemd-strata:8080/v1
        STRATA_API_KEY: ((strata-key))
        STRATA_MODEL: auto
        RAGFLOW_URL: http://systemd-ragflow:9380
        RAGFLOW_API_KEY: ((kb-ragflow-key))
        LIGHTRAG_URL: http://systemd-lightrag:9621
        LIGHTRAG_API_KEY: ((kb-lightrag-key))
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          pip install --quiet boto3
          cp tooling/agents/nk_common.py tooling/agents/nk_taste.py tooling/agents/kb_ingest.py .
          python nk_taste.py 2>&1 | tee taste-out/run.log

- name: cook
  build_log_retention: {builds: 20}
  plan:
  - get: nk-winner
    trigger: true
  - get: tooling
  - task: build-prototype
    timeout: 25m
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: docker.io/library/python, tag: 3.14-slim}
      inputs: [{name: nk-winner}, {name: tooling}]
      outputs: [{name: cook-out}]
      params:
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        ARTIFACTS_BUCKET: ci-artifacts
        STRATA_URL: http://systemd-strata:8080/v1
        STRATA_API_KEY: ((strata-key))
        STRATA_MODEL: auto
        RAGFLOW_URL: http://systemd-ragflow:9380
        RAGFLOW_API_KEY: ((kb-ragflow-key))
        LIGHTRAG_URL: http://systemd-lightrag:9621
        LIGHTRAG_API_KEY: ((kb-lightrag-key))
        NK_FORGE_OWNER: pipeline
        NK_FORGE_REPO: night-kitchen
        NK_GIT_HOST: systemd-forge:3000
        NK_GIT_USER: ((forge-user))
        NK_GIT_TOKEN: ((forge-token))
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
          pip install --quiet boto3
          cp tooling/agents/nk_common.py tooling/agents/nk_cook.py tooling/agents/kb_ingest.py .
          python nk_cook.py 2>&1 | tee cook-out/run.log

- name: serve
  build_log_retention: {builds: 20}
  plan:
  - get: change
    trigger: true
  - get: base
  - get: tooling
  - task: review-the-dish
    timeout: 25m
    config:
      platform: linux
      image_resource:
        type: registry-image
        # archlinux: same base the repo-review agent proved against
        # (prowl binary glibc), full -Syu per the verified Arch CI trap.
        source: {repository: docker.io/library/archlinux, tag: latest}
      inputs: [{name: change}, {name: base}, {name: tooling}]
      outputs: [{name: serve-out}]
      params:
        FORGE_URL: http://systemd-forge:3000
        FORGE_TOKEN: ((forge-review-token))   # write:repository + write:issue
        FORGE_OWNER: pipeline
        FORGE_REPO: night-kitchen
        BASE_BRANCH: main
        REVIEW_BRANCH: review/next
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        PROWL_BUCKET: ci-artifacts
        PROWL_KEY: images/prowl.gz
        PROWL: auto
        STRATA_URL: http://systemd-strata:8080/v1
        STRATA_API_KEY: ((strata-key))
        STRATA_MODEL: auto
        RAGFLOW_URL: http://systemd-ragflow:9380
        RAGFLOW_API_KEY: ((kb-ragflow-key))
        LIGHTRAG_URL: http://systemd-lightrag:9621
        LIGHTRAG_API_KEY: ((kb-lightrag-key))
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git python python-pip ca-certificates >/dev/null 2>&1
          python -m pip install --quiet --break-system-packages boto3 pytest
          python tooling/agents/review_change.py 2>&1 | tee serve-out/run.log
          cp review-notes.md serve-out/ 2>/dev/null || true

- name: wash-up
  build_log_retention: {builds: 20}
  plan:
  - get: twice-daily
  - get: tooling
  - task: kitchen-log
    timeout: 10m
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: docker.io/library/python, tag: 3.14-slim}
      inputs: [{name: tooling}]
      params:
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        ARTIFACTS_BUCKET: ci-artifacts
        INBOX_BUCKET: doc-inbox
        RAGFLOW_URL: http://systemd-ragflow:9380
        RAGFLOW_API_KEY: ((kb-ragflow-key))
        LIGHTRAG_URL: http://systemd-lightrag:9621
        LIGHTRAG_API_KEY: ((kb-lightrag-key))
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          pip install --quiet boto3
          cp tooling/agents/nk_common.py tooling/agents/nk_washup.py tooling/agents/kb_ingest.py .
          python nk_washup.py 2>&1
