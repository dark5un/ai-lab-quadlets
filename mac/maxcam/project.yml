# XcodeGen manifest — MaxCamHost + CMIO Camera Extension (no GUI needed).
# Extension is compiled as an appex and EMBEDDED MANUALLY by build.sh into
# Contents/Library/SystemExtensions (xcodegen's PlugIns embed is the wrong
# path for system extensions).
name: MaxCamHost
options:
  bundleIdPrefix: io.onlyascii
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: R2XM78R4TE
    CODE_SIGN_STYLE: Automatic
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MaxCamExtension:
    type: system-extension
    platform: macOS
    sources: [ext]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.onlyascii.maxcam.extension
        INFOPLIST_FILE: ext/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MAX Camera Extension"
        CODE_SIGN_ENTITLEMENTS: ext.entitlements
  MaxCamHost:
    type: application
    platform: macOS
    sources: [host]
    dependencies:
      - target: MaxCamExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.onlyascii.maxcam
        INFOPLIST_FILE: host/Info.plist
        CODE_SIGN_ENTITLEMENTS: host.entitlements
