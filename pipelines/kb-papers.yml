# kb-papers.yml — arXiv paper acquisition straight into the Knowledge Base.
#
# Flow (Concourse-involving part of the KB integration):
#   fetch-papers (manual + every-6h timer): agent queries arXiv for recent
#     AI papers, publishes PDFs to s3://doc-inbox/papers/ and paper CARDS
#     (title/authors/abstract .md) to s3://doc-inbox/pending/ — the cards
#     trigger the existing docs-agent pipeline, whose summaries are now
#     themselves mirrored into the KB (agents/summarize_docs.py).
#   kb-ingest-papers: s3 resource on papers/*.pdf triggers a task that
#     uploads each PDF into the RAGFlow `ai-papers` dataset (parse+embed),
#     mirrors extracted text into the LightRAG knowledge graph, and
#     archives the original under papers-processed/ (exactly-once, same
#     sweep semantics as docs-agent).
#
# Apply:
#   fly -t local set-pipeline -p kb-papers -c pipelines/kb-papers.yml \
#       -l ~/.config/containers/config/concourse/pipeline-vars.yml

resources:
- name: paper-drop
  type: s3
  check_every: 1m
  source:
    bucket: doc-inbox
    endpoint: http://systemd-s3:3900
    disable_ssl: true
    use_path_style: true
    region_name: garage
    access_key_id: ((s3-ak))
    secret_access_key: ((s3-sk))
    skip_download: true    # trigger-only; the ingest task sweeps papers/ itself
    regexp: "^papers/(?P<version>[0-9]{9,11})-.*\\.pdf$"

- name: tooling
  type: git
  check_every: 1m
  source:
    uri: http://systemd-forge:3000/pipeline/pipeline-lab.git
    branch: main
    username: ((forge-user))
    password: ((forge-token))

jobs:
- name: fetch-papers
  build_log_retention:
    builds: 20
  plan:
  - get: tooling
  - task: scout-arxiv
    timeout: 25m
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: docker.io/library/python, tag: 3.14-slim}
      inputs:
      - {name: tooling}
      outputs:
      - {name: scout-out}
      params:
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        INBOX_BUCKET: doc-inbox
        ARTIFACTS_BUCKET: ci-artifacts
        PAPER_LIMIT: "10"
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          pip install --quiet boto3
          # arXiv egress from the task: the worker gives task containers
          # internet NAT (same path the registry-image pulls use)
          python tooling/agents/fetch_papers.py 2>&1 | tee scout-out/run.log

- name: kb-ingest-papers
  build_log_retention:
    builds: 20
  plan:
  - get: paper-drop
    trigger: true
  - get: tooling
  - task: ingest-into-kb
    timeout: 80m   # RAGFlow rc3 = one ingestion worker: a batch of PDFs
                # can spend >40m in the parse queue; the sweep is re-entrant
    config:
      platform: linux
      image_resource:
        type: registry-image
        source: {repository: docker.io/library/python, tag: 3.14-slim}
      inputs:
      - {name: paper-drop}
      - {name: tooling}
      outputs:
      - {name: ingest-out}
      params:
        S3_ENDPOINT_URL: http://systemd-s3:3900
        S3_REGION: garage
        S3_ACCESS_KEY_ID: ((s3-ak))
        S3_SECRET_ACCESS_KEY: ((s3-sk))
        INBOX_BUCKET: doc-inbox
        ARTIFACTS_BUCKET: ci-artifacts
        RAGFLOW_URL: http://systemd-ragflow:9380
        RAGFLOW_API_KEY: ((kb-ragflow-key))
        LIGHTRAG_URL: http://systemd-lightrag:9621
        LIGHTRAG_API_KEY: ((kb-lightrag-key))
        KB_PARSE_TIMEOUT: "600"
      run:
        path: bash
        args:
        - -c
        - |
          set -euo pipefail
          pip install --quiet boto3
          cp tooling/agents/ingest_papers.py tooling/agents/kb_ingest.py .
          python ingest_papers.py 2>&1 | tee ingest-out/run.log
